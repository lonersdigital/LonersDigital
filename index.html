<!DOCTYPE html>
<html lang="sw">
<head>

        .header { margin-bottom: 20px; }
        .banner { width: 100%; border-radius: 15px; margin-bottom: 10px; }

        .card { background: #1e1e1e; border-radius: 15px; padding: 10px; border: 1px solid #333; position: relative; }
        .card img { width: 100%; border-radius: 10px; }
        .badge { position: absolute; top: 15px; right: 15px; background: #00cc66; font-size: 10px; padding: 3px 8px; border-radius: 5px; }
        .wa-btn { background-color: #25D366; color: white; padding: 12px; border-radius: 50px; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: 30px; font-weight: bold; }
        .footer-info { background: #1e1e1e; border-radius: 10px; padding: 15px; margin-top: 20px; display: flex; justify-content: space-between; font-size: 12px; }
    </style>
</head>

</html>
